<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags (from original repo) -->
    <title>Willson Rai — Barista & Freelancer</title>
    <meta name="description" content="Official portfolio website of Willson Rai. Graphic designer and developer from Nepal." />
    <meta name="keywords" content="Willson Rai, Portfolio, Graphic Designer Nepal" />
    <meta name="author" content="Willson Rai" />
    <meta name="robots" content="index, follow" />

    <!-- Extended SEO enhancements -->
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#1a1310" />
    <link rel="canonical" href="https://willsonrai.com.np/" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="NP-3" />
    <meta name="geo.placename" content="Lalitpur, Nepal" />
    <meta name="geo.position" content="27.6588;85.3247" />
    <meta name="ICBM" content="27.6588, 85.3247" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://willsonrai.com.np/" />
    <meta property="og:site_name" content="Willson Rai" />
    <meta property="og:title" content="Willson Rai — Barista & Freelancer" />
    <meta
      property="og:description"
      content="Official portfolio website of Willson Rai. Graphic designer and developer from Nepal."
    />
    <meta property="og:image" content="https://willsonrai.com.np/og-image.jpg" />
    <meta property="og:image:alt" content="Willson Rai — Head Barista & Creative Freelancer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://willsonrai.com.np/" />
    <meta name="twitter:title" content="Willson Rai — Barista & Freelancer" />
    <meta
      name="twitter:description"
      content="Official portfolio website of Willson Rai. Graphic designer and developer from Nepal."
    />
    <meta name="twitter:image" content="https://willsonrai.com.np/og-image.jpg" />

    <!-- Icons -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Person (helps Google show your site when people search your name) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Willson Rai",
        "alternateName": "Willson Rai Barista",
        "url": "https://willsonrai.com.np/",
        "jobTitle": "Head Barista & Creative Freelancer",
        "description": "Head Barista and Creative Freelancer based in Lalitpur, Nepal with over 7 years of experience in the coffee and hospitality industry, specializing in espresso extraction, latte art, café menu design, and culinary photography.",
        "email": "mailto:007imbill@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lalitpur",
          "addressRegion": "Bagmati",
          "addressCountry": "Nepal"
        },
        "worksFor": {
          "@type": "Organization",
          "name": "Feels Café",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Jhamsikhel, Lalitpur",
            "addressCountry": "Nepal"
          }
        },
        "knowsAbout": [
          "Espresso Extraction",
          "Latte Art",
          "Manual Brewing",
          "Café Menu Design",
          "Barista Training",
          "Culinary Photography",
          "Inventory & POS Management"
        ]
      }
    </script>

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Willson Rai — Portfolio",
        "url": "https://willsonrai.com.np/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
